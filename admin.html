<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<style>
:root{--bg:#0b0608;--card:#170d11;--line:#3a2229;--ink:#f4eef0;--muted:#a99aa0;--accent:#e5262f;--rose:#ff7a85;--ok:#5ee08f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:0 0 60px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.danger{color:var(--rose)}
input,select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:4px}
input[type=checkbox]{width:auto;margin:0}
input[type=color]{padding:2px;height:40px;width:56px;cursor:pointer}
label{display:block;font-size:.85rem;color:var(--muted);margin-top:12px}
.box{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px}
.box h1{margin:0 0 6px;font-size:1.4rem}
.box button{width:100%;margin-top:14px}
.err{color:var(--rose);font-size:.9rem;min-height:1.2em;margin:8px 0 0}
.good{color:var(--ok);font-size:.9rem}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,6,8,.95);z-index:5}
header h1{font-size:1.1rem;margin:0}
nav{display:flex;gap:8px}
.tab[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.badge{background:#fff;color:var(--accent);border-radius:999px;padding:0 7px;font-size:.78rem;font-weight:700;margin-left:4px}
main{max-width:900px;margin:0 auto;padding:18px 20px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.thumb{width:56px;height:56px;border-radius:10px;background-size:cover;background-position:center;flex:none;display:grid;place-items:center;font-weight:700;font-size:1.3rem}
.grow{flex:1;min-width:0}
.grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--muted);font-size:.85rem}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.actions button{padding:6px 12px;font-size:.88rem}
.stock{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(560px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h2{margin:0 0 4px;font-size:1.2rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{width:90px;height:90px;border-radius:12px;background:var(--bg) center/cover no-repeat;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:.75rem;flex:none}
.photo{display:flex;gap:12px;align-items:center;margin-top:6px}
.crow{display:grid;grid-template-columns:1fr 56px 64px auto;gap:8px;align-items:center;margin-top:8px}
.crow .preview{width:44px;height:44px}
.dfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.order{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.order.new{border-color:var(--accent)}
.ohead{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.ohead select{width:auto;margin:0}
.order ul{margin:8px 0;padding-left:18px}
.order a{color:var(--rose)}
.total{font-weight:700;font-size:1.05rem}
@media (max-width:560px){.two{grid-template-columns:1fr}.row{flex-wrap:wrap}.actions{width:100%;justify-content:flex-start}}
</style>
</head>
<body>

<div class="box" id="login">
  <h1>Admin login</h1>
  <p class="sub" id="cfgWarn" hidden>Firebase is not set up yet. Fill in <b>firebase-config.js</b> first.</p>
  <label for="em">Email</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <button class="pri" id="loginBtn">Sign in</button>
  <p class="err" id="lerr" role="alert"></p>
</div>

<div id="app" hidden>
  <header>
    <h1 id="title">Admin</h1>
    <nav>
      <button class="tab" data-tab="products" aria-pressed="true">Products</button>
      <button class="tab" data-tab="orders" aria-pressed="false">Orders<span class="badge" id="newCount" hidden></span></button>
    </nav>
    <button id="logout">Sign out</button>
  </header>
  <main>
    <section id="tab-products">
      <div class="bar">
        <button class="pri" id="addP">+ Add product</button>
        <button id="importP">Import from products.js</button>
        <span class="sub" id="pmsg" role="status"></span>
      </div>
      <div id="plist"></div>
    </section>
    <section id="tab-orders" hidden>
      <p class="err" id="omsg" role="alert"></p>
      <div class="bar"><span class="sub">Next order number:</span>
        <input id="nextNo" type="number" min="0" step="1" style="width:100px;margin:0" aria-label="Next order number">
        <button id="setNo">Set</button><span class="sub" id="nextFmt"></span></div>
      <div class="bar" id="ofilters"></div>
      <div id="olist"></div>
    </section>
  </main>
</div>

<dialog id="dlg">
  <h2 id="dTitle">Product</h2>
  <label for="pName">Name</label><input id="pName">
  <div class="two">
    <div><label for="pCat">Category</label><input id="pCat" list="cats"><datalist id="cats"></datalist></div>
    <div><label for="pPrice">Price (price of 1 piece)</label><input id="pPrice" type="number" min="0" step="0.01" inputmode="decimal"></div>
  </div>
  <div class="two">
    <div><label>&nbsp;</label><label style="display:flex;gap:8px;align-items:center;color:var(--ink);margin:6px 0 0"><input type="checkbox" id="pStock"> In stock</label></div>
    <div><label for="pTile">Tile color (when there is no photo)</label><input id="pTile" type="color" value="#3f6e9a"></div>
  </div>
  <label for="pDesc">Short description</label><input id="pDesc">
  <label for="pDetails">Details (one per line, like "Warranty: 1 month")</label><textarea id="pDetails" rows="4"></textarea>

  <label>Photo</label>
  <div class="photo"><div class="preview" id="pPrev">No photo</div>
    <div><input type="file" id="pFile" accept="image/*"><button type="button" id="pRemove" class="danger" style="margin-top:6px;padding:5px 12px;font-size:.85rem">Remove photo</button></div></div>

  <label>Colors (optional, customer picks and the photo changes)</label>
  <div id="pColors"></div>
  <button type="button" id="addColor" style="margin-top:8px;font-size:.88rem;padding:6px 14px">+ Add color</button>

  <label for="pDeals">Deals (optional, one per line as pieces:price, e.g. "3:5"). Customers then pick 1 pc / 3 pcs…</label>
  <textarea id="pDeals" rows="3" placeholder="2:28&#10;5:65"></textarea>

  <p class="err" id="derr" role="alert"></p>
  <div class="dfoot"><button id="dCancel">Cancel</button><button class="pri" id="dSave">Save</button></div>
</dialog>

<script src="products.js"></script>
<script src="firebase-config.js"></script>
<script type="module">
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ok=typeof FIREBASE_CONFIG!=="undefined"&&FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey&&!/PASTE/.test(FIREBASE_CONFIG.apiKey);
$("title").textContent=(typeof SHOP_NAME!=="undefined"?SHOP_NAME:"Shop")+" admin";
document.title=$("title").textContent;
if(!ok){$("cfgWarn").hidden=false;$("loginBtn").disabled=true}
else{try{
const B="https://www.gstatic.com/firebasejs/10.12.2/";
const {initializeApp}=await import(B+"firebase-app.js");
const {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}=await import(B+"firebase-auth.js");
const {getFirestore,collection,doc,setDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,limit}=await import(B+"firebase-firestore.js");
const app=initializeApp(FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app);

let products=[],orders=[],ofilter="all",unsubP=null,unsubO=null,unsubC=null,editing=null;

// ---------- login ----------
const doLogin=async()=>{$("lerr").textContent="";
  try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}
  catch(e){$("lerr").textContent=/network/i.test(e.code||"")?"No internet connection.":"Wrong email or password."}};
$("loginBtn").onclick=doLogin;$("pw").onkeydown=e=>{if(e.key==="Enter")doLogin()};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
  $("login").hidden=!!u;$("app").hidden=!u;
  if(unsubP){unsubP();unsubP=null}if(unsubO){unsubO();unsubO=null}if(unsubC){unsubC();unsubC=null}
  if(!u)return;
  const denied=what=>e=>{console.warn(what,e);
    $("pmsg").innerHTML=$("omsg").innerHTML=`Access denied for <b>${what}</b> (signed in as <b>${esc(u.email)}</b>). In Firebase, open Firestore > Rules and check that the email in the rules is exactly this one, and that the latest rules are published.`};
  unsubP=onSnapshot(collection(db,"products"),s=>{products=s.docs.map(d=>d.data()).sort((a,b)=>(a.id||0)-(b.id||0));renderProducts()},denied("products"));
  unsubO=onSnapshot(query(collection(db,"orders"),orderBy("createdAt","desc"),limit(300)),s=>{orders=s.docs.map(d=>({_id:d.id,...d.data()}));renderOrders()},denied("orders"));
  unsubC=onSnapshot(doc(db,"counters","orders"),s=>{const start=typeof ORDER_START!=="undefined"?ORDER_START:1;
    const next=s.exists()?(s.data().n||0)+1:start;
    if(document.activeElement!==$("nextNo"))$("nextNo").value=next;$("nextFmt").textContent="→ "+fmtNo(next)},denied("order counter"));
});

// ---------- order numbers ----------
const fmtNo=n=>(typeof ORDER_PREFIX!=="undefined"?ORDER_PREFIX:"#")+String(n).padStart(typeof ORDER_DIGITS!=="undefined"?ORDER_DIGITS:4,"0");
$("setNo").onclick=async()=>{const v=parseInt($("nextNo").value,10);
  if(isNaN(v)||v<0){alert("Enter a number, 0 or higher.");return}
  if(!confirm(`The next order will be ${fmtNo(v)}. Orders already saved keep their old numbers. Continue?`))return;
  try{await setDoc(doc(db,"counters","orders"),{n:v-1});$("nextNo").blur()}catch(e){alert("Could not save: "+e.message)}};

// ---------- tabs ----------
document.querySelectorAll("nav .tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav .tab").forEach(x=>x.setAttribute("aria-pressed",x===b));
  $("tab-products").hidden=b.dataset.tab!=="products";$("tab-orders").hidden=b.dataset.tab!=="orders"});

// ---------- products list ----------
const money=n=>"$"+(Math.round(n*100)/100);
function renderProducts(){
  $("cats").innerHTML=[...new Set(products.map(p=>p.cat))].map(c=>`<option value="${esc(c)}">`).join("");
  if(!products.length){$("plist").innerHTML='<p class="sub">No products yet. Press "Import from products.js" to copy your current products, or "+ Add product".</p>';return}
  $("plist").innerHTML=products.map(p=>{
    const st=p.img?`background-image:url('${esc(p.img)}')`:`background:${esc(p.color||"#444")}`;
    const price=p.deals&&p.deals.length?`from ${money(Math.min(...[p.price>0?p.price:Infinity,...p.deals.map(d=>d.price)]))} · ${p.deals.length} deal${p.deals.length>1?"s":""}`:money(p.price);
    return `<div class="row"><div class="thumb" style="${st}">${p.img?"":esc((p.name||"?")[0])}</div>
      <div class="grow"><b>${esc(p.name)}</b><span class="sub">${esc(p.cat)} · ${price}${p.colors&&p.colors.length?` · ${p.colors.length} colors`:""}</span></div>
      <div class="actions"><label class="stock"><input type="checkbox" data-stock="${p.id}" ${p.inStock?"checked":""}> In stock</label>
      <button data-edit="${p.id}">Edit</button><button class="danger" data-del="${p.id}">Delete</button></div></div>`}).join("");
}
$("plist").onclick=async e=>{
  const t=e.target;
  if(t.dataset.edit)openEditor(products.find(p=>p.id==t.dataset.edit));
  if(t.dataset.del){const p=products.find(p=>p.id==t.dataset.del);
    if(confirm(`Delete "${p.name}"? This cannot be undone.`))await deleteDoc(doc(db,"products",String(p.id))).catch(err=>alert("Could not delete: "+err.message))}
};
$("plist").onchange=async e=>{if(e.target.dataset.stock)await updateDoc(doc(db,"products",String(e.target.dataset.stock)),{inStock:e.target.checked}).catch(err=>alert("Could not save: "+err.message))};

$("addP").onclick=()=>openEditor();
$("importP").onclick=async()=>{
  if(typeof PRODUCTS==="undefined"||!PRODUCTS.length){$("pmsg").textContent="products.js has no products.";return}
  if(products.length&&!confirm("Products with the same number will be overwritten by the ones in products.js. Continue?"))return;
  $("pmsg").textContent="Importing…";
  try{for(const p of PRODUCTS)await setDoc(doc(db,"products",String(p.id)),JSON.parse(JSON.stringify(p)));$("pmsg").textContent=`Imported ${PRODUCTS.length} products.`}
  catch(e){$("pmsg").textContent="Import failed: "+e.message}
};

// ---------- editor ----------
const dlg=$("dlg");
function setPrev(el,src){el.style.backgroundImage=src?`url('${src}')`:"";el.textContent=src?"":(el.id==="pPrev"?"No photo":"")}
function openEditor(p){
  const isNew=!p;
  editing=p?JSON.parse(JSON.stringify(p)):{id:Math.max(0,...products.map(x=>x.id||0))+1,name:"",cat:"",price:0,inStock:true,color:"#3f6e9a",desc:"",details:[],colors:[]};
  editing.colors=editing.colors||[];
  $("dTitle").textContent=isNew?"Add product":"Edit product";
  $("pName").value=editing.name;$("pCat").value=editing.cat;$("pPrice").value=editing.price;
  $("pStock").checked=editing.inStock!==false;$("pTile").value=/^#[0-9a-f]{6}$/i.test(editing.color||"")?editing.color:"#3f6e9a";
  $("pDesc").value=editing.desc||"";$("pDetails").value=(editing.details||[]).join("\n");
  $("pDeals").value=(editing.deals||[]).map(d=>`${d.qty}:${d.price}`).join("\n");
  $("pFile").value="";setPrev($("pPrev"),editing.img);
  renderColors();$("derr").textContent="";dlg.showModal();$("pName").focus();
}
function renderColors(){
  $("pColors").innerHTML=editing.colors.map((c,i)=>`<div class="crow">
    <input data-cn="${i}" placeholder="Name (Black)" value="${esc(c.name)}">
    <input data-ch="${i}" type="color" value="${/^#[0-9a-f]{6}$/i.test(c.hex||"")?c.hex:"#888888"}" aria-label="Color">
    <div class="preview" data-cp="${i}" style="${c.img?`background-image:url('${esc(c.img)}')`:""}"></div>
    <button type="button" class="danger" data-cx="${i}" style="padding:5px 10px">✕</button>
    <input data-cf="${i}" type="file" accept="image/*" style="grid-column:1/-1;margin:0"></div>`).join("");
}
$("addColor").onclick=()=>{editing.colors.push({name:"",hex:"#888888",img:""});renderColors()};
$("pColors").oninput=e=>{const t=e.target;
  if(t.dataset.cn!=null)editing.colors[t.dataset.cn].name=t.value;
  if(t.dataset.ch!=null)editing.colors[t.dataset.ch].hex=t.value};
$("pColors").onclick=e=>{if(e.target.dataset.cx!=null){editing.colors.splice(+e.target.dataset.cx,1);renderColors()}};
$("pColors").onchange=async e=>{const t=e.target;if(t.dataset.cf==null||!t.files[0])return;
  try{const d=await resize(t.files[0]);editing.colors[t.dataset.cf].img=d;setPrev(document.querySelector(`[data-cp="${t.dataset.cf}"]`),d)}catch(err){$("derr").textContent=err.message}};
$("pFile").onchange=async e=>{if(!e.target.files[0])return;
  try{editing.img=await resize(e.target.files[0]);setPrev($("pPrev"),editing.img);$("derr").textContent=""}catch(err){$("derr").textContent=err.message}};
$("pRemove").onclick=()=>{delete editing.img;$("pFile").value="";setPrev($("pPrev"),"")};
$("dCancel").onclick=()=>dlg.close();

function resize(file,max=700){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
    let out=c.toDataURL("image/webp",.8);if(!out.startsWith("data:image/webp"))out=c.toDataURL("image/jpeg",.82);res(out)};
  img.onerror=()=>rej(new Error("That file is not a picture."));img.src=u})}

$("dSave").onclick=async()=>{
  const name=$("pName").value.trim(),cat=$("pCat").value.trim()||"Other",price=parseFloat($("pPrice").value);
  const deals=$("pDeals").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(\d+)\D+(\d+(?:\.\d+)?)$/);return m?{qty:+m[1],price:+m[2]}:null});
  if(!name){$("derr").textContent="Please enter a name.";return}
  if(deals.includes(null)){$("derr").textContent='Deals must look like "3:5" (pieces:price), one per line.';return}
  if(deals.some(d=>d.qty<2)){$("derr").textContent="A deal needs 2 or more pieces. The price of 1 piece goes in the Price box.";return}
  if(isNaN(price)||price<0){$("derr").textContent="Please enter a price (0 if you only sell by deals).";return}
  if(!deals.length&&!(price>0)){$("derr").textContent="Please enter a price.";return}
  const colors=editing.colors.filter(c=>c.name.trim()).map(c=>{const o={name:c.name.trim(),hex:c.hex||"#888888"};if(c.img)o.img=c.img;return o});
  const d={id:editing.id,name,cat,price,inStock:$("pStock").checked,color:$("pTile").value,desc:$("pDesc").value.trim(),
    details:$("pDetails").value.split("\n").map(l=>l.trim()).filter(Boolean)};
  if(editing.img)d.img=editing.img;if(colors.length)d.colors=colors;if(deals.length)d.deals=deals;
  if(JSON.stringify(d).length>900000){$("derr").textContent="The photos are too big together. Remove one or use smaller pictures.";return}
  $("dSave").disabled=true;
  try{await setDoc(doc(db,"products",String(d.id)),d);dlg.close()}
  catch(e){$("derr").textContent="Could not save: "+e.message}
  $("dSave").disabled=false;
};

// ---------- orders ----------
const STATUS=["new","confirmed","delivered","cancelled"];
const waNum=p=>{let d=String(p).replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);return d.startsWith("961")?d:"961"+d.replace(/^0+/,"")};
function renderOrders(){
  const n=orders.filter(o=>o.status==="new").length;
  $("newCount").textContent=n;$("newCount").hidden=!n;document.title=(n?`(${n}) `:"")+$("title").textContent;
  $("ofilters").innerHTML=["all",...STATUS].map(s=>`<button class="tab ftab" data-f="${s}" aria-pressed="${s===ofilter}">${s[0].toUpperCase()+s.slice(1)}${s==="all"?"":` (${orders.filter(o=>o.status===s).length})`}</button>`).join("");
  const list=orders.filter(o=>ofilter==="all"||o.status===ofilter);
  if(!list.length){$("olist").innerHTML='<p class="sub">No orders here yet.</p>';return}
  $("olist").innerHTML=list.map(o=>{
    const t=o.createdAt&&o.createdAt.toDate?o.createdAt.toDate().toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"just now";
    return `<div class="order ${o.status==="new"?"new":""}">
      <div class="ohead"><div><b>${esc(o.ref)}</b> <span class="sub">· ${esc(t)}</span></div>
        <select data-st="${esc(o._id)}" aria-label="Status">${STATUS.map(s=>`<option value="${s}" ${s===o.status?"selected":""}>${s[0].toUpperCase()+s.slice(1)}</option>`).join("")}</select></div>
      <ul>${(o.items||[]).map(i=>`<li>${esc(i.name)}${i.color?` (${esc(i.color)})`:""}${i.pack?` - ${esc(i.pack)}`:""}${i.qty>1?` × ${i.qty}`:""} - ${money(i.total)}</li>`).join("")}</ul>
      <div class="total">Total ${money(o.total||0)} <span class="sub">· ${esc(o.pay||"")}</span></div>
      <div style="margin-top:8px"><b>${esc(o.name)}</b> · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a> · <a href="https://wa.me/${waNum(o.phone)}" target="_blank" rel="noopener">WhatsApp</a><br>
      <span class="sub">${esc(o.addr)}</span>${o.notes?`<br><span class="sub">Notes: ${esc(o.notes)}</span>`:""}</div>
      <div style="margin-top:8px;text-align:right"><button class="danger" data-od="${esc(o._id)}" style="padding:5px 12px;font-size:.85rem">Delete</button></div></div>`}).join("");
}
$("ofilters").onclick=e=>{if(e.target.dataset.f){ofilter=e.target.dataset.f;renderOrders()}};
$("olist").onchange=async e=>{if(e.target.dataset.st)await updateDoc(doc(db,"orders",e.target.dataset.st),{status:e.target.value}).catch(err=>alert("Could not save: "+err.message))};
$("olist").onclick=async e=>{if(e.target.dataset.od&&confirm("Delete this order?"))await deleteDoc(doc(db,"orders",e.target.dataset.od)).catch(err=>alert("Could not delete: "+err.message))};
}catch(e){console.error(e);$("lerr").textContent="Could not load Firebase. Check your internet connection."}}
</script>
</body>
</html>
