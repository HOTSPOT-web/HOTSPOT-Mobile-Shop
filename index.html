<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hotspot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0507;--surface:rgba(26,12,16,.7);--ink:#f6eeee;--muted:#b39a9d;--accent:#d71f2b;--accent-ink:#fff;--line:#3a1c20;--rose:#ff6b6b;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.amb{position:fixed;inset:-15%;z-index:-1;pointer-events:none;background:
radial-gradient(520px 420px at 15% 12%,rgba(229,38,47,.38),transparent 62%),
radial-gradient(480px 480px at 88% 38%,rgba(150,8,24,.34),transparent 62%),
radial-gradient(640px 460px at 38% 100%,rgba(229,38,47,.22),transparent 62%);animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.amb{animation:none}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;margin:0}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 20px;position:sticky;top:env(safe-area-inset-top,0px);background:rgba(10,5,7,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:52px;aspect-ratio:1320/423;background:var(--logo) center/contain no-repeat;mix-blend-mode:lighten}
header{min-height:74px}
.cartbtn{grid-column:3;justify-self:end}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#0a0507;transition:opacity .6s,visibility .6s}
#splash::before{content:"";position:absolute;width:140vmin;height:140vmin;background:radial-gradient(closest-side,rgba(229,38,47,.32),transparent);animation:pulse 3s ease-in-out infinite alternate}
#splash.hide{opacity:0;visibility:hidden}
.splogo{position:relative;width:min(440px,82vw);aspect-ratio:1320/423;background:var(--logo) center/contain no-repeat;mix-blend-mode:lighten;animation:pop .9s ease both}
#splash p{position:relative;margin:0;color:var(--muted);letter-spacing:.08em}
.bar{position:relative;width:min(240px,60vw);height:3px;background:#3a1c20;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);box-shadow:0 0 12px rgba(229,38,47,.8);animation:load 1.8s ease-in-out forwards}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes load{to{width:100%}}
@keyframes pulse{from{transform:scale(.9);opacity:.7}to{transform:scale(1.08);opacity:1}}
@media (prefers-reduced-motion:reduce){#splash::before,.splogo{animation:none}.bar i{animation:none;width:100%}#splash{transition:none}}

button{font:inherit;cursor:pointer;border:0;border-radius:999px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.cartbtn{box-shadow:0 0 16px rgba(229,38,47,.45);background:var(--accent);color:var(--accent-ink);padding:9px 18px;font-weight:700}
.hero{max-width:900px;margin:0 auto;padding:44px 20px 18px}
.hero h1{text-shadow:0 0 44px rgba(229,38,47,.5);font-size:clamp(2.2rem,7vw,4rem);line-height:1;letter-spacing:-.03em;font-weight:800}
.hero p{color:var(--muted);max-width:46ch;margin:14px 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;max-width:900px;margin:0 auto;padding:12px 20px}
.chip{background:transparent;border:1.5px solid var(--line);color:var(--ink);padding:7px 16px}
.chip[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 18px rgba(229,38,47,.5)}
.grid{max-width:900px;margin:0 auto;padding:8px 20px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:1;display:grid;place-items:center;font:800 4rem 'Bricolage Grotesque',sans-serif;color:rgba(255,255,255,.85);background-size:cover;background-position:center}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h3{font-size:1.05rem}
.cat{color:var(--muted);font-size:.85rem}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px}
.price{font-weight:700;font-size:1.1rem}
.add{background:var(--accent);color:#fff;padding:7px 14px;font-weight:500}
.add:disabled{opacity:.45;cursor:not-allowed}
aside{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#140a0d;border-left:1px solid var(--line);z-index:20;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:-8px 0 30px rgba(0,0,0,.2)}
aside.open{transform:none}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
.items{flex:1;overflow:auto;margin:14px 0}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;background:var(--bg);color:var(--ink);padding:0}
.x{background:none;color:var(--muted);font-size:1.5rem;line-height:1;padding:4px 10px}
input,textarea{width:100%;font:inherit;padding:10px 12px;margin-top:8px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem;margin:12px 0}
.send{width:100%;background:#1f9d55;color:#fff;padding:14px;font-weight:700}
.note{color:var(--muted);font-size:.85rem;margin:8px 0 0}
.empty{color:var(--muted);text-align:center;padding:30px 0}
</style>
</head>
<body>
<div class="amb" aria-hidden="true"></div>
<div id="splash" role="status" aria-label="Loading"><div class="splogo" role="img" aria-label="Hotspot Mobile Shop"></div><p>Welcome</p><div class="bar"><i></i></div></div>
<header><span></span><div class="logo" id="shopName" role="img"></div><button class="cartbtn" id="openCart">Cart (<span id="count">0</span>)</button></header>
<section class="hero"><h1>Phones and everything that goes with them.</h1><p>Browse what’s in stock, add your picks to the cart, and send your order straight to us on WhatsApp.</p></section>
<div class="chips" id="chips"></div>
<main class="grid" id="grid"></main>

<aside id="cart" aria-label="Your cart">
  <div style="display:flex;justify-content:space-between;align-items:center"><h2>Your cart</h2><button class="x" id="closeCart" aria-label="Close cart">×</button></div>
  <div class="items" id="items"></div>
  <div class="total"><span>Total</span><span id="total">$0</span></div>
  <input id="name" placeholder="Your name" autocomplete="name">
  <input id="phone" placeholder="Phone number" inputmode="tel" autocomplete="tel">
  <textarea id="addr" rows="2" placeholder="Delivery address"></textarea>
  <p class="note" id="err" role="alert" style="color:var(--rose)"></p>
  <button class="send" id="send">Send order on WhatsApp</button>
  <p class="note">This opens WhatsApp with your order ready to send. Pay on delivery.</p>
</aside>

</script>
<script src="products.js"></script>
<script>

const $=id=>document.getElementById(id);
const money=n=>CURRENCY+n.toFixed(n%1?2:0);
let cart={},filter="All";
try{cart=JSON.parse(localStorage.getItem("cart")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("cart",JSON.stringify(cart))}catch(e){}};
$("shopName").setAttribute("aria-label",SHOP_NAME);document.title=SHOP_NAME;

function renderChips(){
  const cats=["All",...new Set(PRODUCTS.map(p=>p.cat))];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===filter}" data-c="${c}">${c}</button>`).join("");
  $("chips").onclick=e=>{const c=e.target.dataset.c;if(c){filter=c;renderChips();renderGrid()}};
}
function renderGrid(){
  $("grid").innerHTML=PRODUCTS.filter(p=>filter==="All"||p.cat===filter).map(p=>{
    const st=p.img?`background-image:url('${p.img}')`:`background:${p.color}`;
    return `<article class="card"><div class="pic" style="${st}" role="img" aria-label="${p.name}">${p.img?"":p.name[0]}</div>
    <div class="info"><h3>${p.name}</h3><span class="cat">${p.cat}</span>${p.desc?`<span class="cat" style="color:var(--ink)">${p.desc}</span>`:""}
    <div class="row"><span class="price">${money(p.price)}</span>
    <button class="add" data-id="${p.id}" ${p.inStock?"":"disabled"}>${p.inStock?"Add":"Sold out"}</button></div></div></article>`}).join("");
}
$("grid").onclick=e=>{const id=e.target.dataset.id;if(id){cart[id]=(cart[id]||0)+1;save();renderCart();e.target.textContent="Added ✓";setTimeout(renderGrid,700)}};

function renderCart(){
  const ids=Object.keys(cart).filter(id=>PRODUCTS.some(p=>p.id==id));
  let total=0,n=0;
  $("items").innerHTML=ids.length?ids.map(id=>{
    const p=PRODUCTS.find(p=>p.id==id),q=cart[id];total+=p.price*q;n+=q;
    return `<div class="item"><div><strong>${p.name}</strong><br><span class="cat">${money(p.price)} each</span></div>
    <div class="qty"><button data-d="-1" data-id="${id}" aria-label="Remove one">−</button><span>${q}</span><button data-d="1" data-id="${id}" aria-label="Add one">+</button></div></div>`}).join("")
    :`<p class="empty">Your cart is empty. Pick something you like.</p>`;
  $("total").textContent=money(total);$("count").textContent=n;
}
$("items").onclick=e=>{const id=e.target.dataset.id;if(!id)return;cart[id]+=+e.target.dataset.d;if(cart[id]<=0)delete cart[id];save();renderCart()};
$("openCart").onclick=()=>$("cart").classList.add("open");
$("closeCart").onclick=()=>$("cart").classList.remove("open");

$("send").onclick=()=>{
  const ids=Object.keys(cart).filter(id=>PRODUCTS.some(p=>p.id==id));
  const name=$("name").value.trim(),phone=$("phone").value.trim(),addr=$("addr").value.trim();
  if(!ids.length){$("err").textContent="Add at least one item first.";return}
  if(!name||!phone||!addr){$("err").textContent="Please fill in your name, phone and address.";return}
  $("err").textContent="";
  let total=0;
  const lines=ids.map(id=>{const p=PRODUCTS.find(p=>p.id==id),q=cart[id];total+=p.price*q;return `• ${p.name} x${q} = ${money(p.price*q)}`});
  const msg=`New order from ${SHOP_NAME}\n\n${lines.join("\n")}\n\nTotal: ${money(total)}\n\nName: ${name}\nPhone: ${phone}\nAddress: ${addr}`;
  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,"_blank");
};
(function(){var sp=$("splash"),t0=Date.now(),done=false;
function hide(){if(done)return;done=true;sp.classList.add("hide");setTimeout(function(){sp.remove()},700)}
function go(){setTimeout(hide,Math.max(0,1900-(Date.now()-t0)))}
if(document.readyState==="complete")go();else window.addEventListener("load",go);
setTimeout(hide,5000);sp.addEventListener("click",hide)})();
renderChips();renderGrid();renderCart();
</script>
</body>
</html>
